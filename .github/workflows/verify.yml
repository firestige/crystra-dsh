name: Verify backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run pack:verify

name: Verify Foundation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify and cache exact published RC inputs
        run: node scripts/verify-candidate-inputs.mjs --cache
      - run: npm rebuild better-sqlite3
      - run: node scripts/build-client-bundles.mjs
      - run: git diff --exit-code -- lib/client.js
      - run: npm test
        env:
          CRYSTRA_CHROME_BINARY: /usr/bin/google-chrome
      - run: npm run build
      - run: npm run pack:verify

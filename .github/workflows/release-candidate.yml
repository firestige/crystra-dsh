name: Release Candidate

on:
  push:
    branches:
      - release/next

permissions: {}

jobs:
  qualify-candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Resolve immutable release request
        id: request
        run: |
          test "$GITHUB_REF_NAME" = "release/next"
          CANDIDATE_TAG="$(jq -er .candidate_tag release/request.json)"
          echo "candidate_tag=$CANDIDATE_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the frozen DSH qualification CLI outside the workspace graph
        run: |
          npm install --global --prefix "$RUNNER_TEMP/dsh-cli" --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.1.1-rc.2 pnpm@11.23.0
          echo "$RUNNER_TEMP/dsh-cli/bin" >> "$GITHUB_PATH"
      - name: Verify the frozen DSH qualification CLI
        run: test "$(dsh --version)" = 0.1.1-rc.2
      - run: npm test
        env:
          CRYSTRA_CHROME_BINARY: /usr/bin/google-chrome
      - run: npm run build
      - run: npm run pack:verify
      - name: Verify immutable remote owner artifact
        run: npm run release:owner:verify
      - run: npm run qualify:clean-profile
      - run: npm run qualify:lifecycle
      - run: npm run qualify:provider-routing
      - run: npm run qualify:real-harness
        env:
          CRYSTRA_CHROME_BINARY: /usr/bin/google-chrome
      - name: Build candidate artifact set
        run: npm run release:candidate -- "$RUNNER_TEMP/candidate"
        env:
          CRYSTRA_RELEASE_CHANNEL: candidate
          CRYSTRA_CANDIDATE_TAG: ${{ steps.request.outputs.candidate_tag }}
      - run: npm run provenance:verify -- "$RUNNER_TEMP/candidate"
      - run: npm run release:qualify -- "$RUNNER_TEMP/candidate"
      - run: test -f "$RUNNER_TEMP/candidate/release-qualification.json"
      - uses: actions/upload-artifact@v7
        with:
          name: crystra-dsh-${{ steps.request.outputs.candidate_tag }}
          path: ${{ runner.temp }}/candidate/*
          if-no-files-found: error
          retention-days: 30
      - id: release-app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CRYSTRA_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.CRYSTRA_RELEASE_APP_PRIVATE_KEY }}
          owner: firestige
          repositories: crystra-dsh
      - name: Create immutable candidate release
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          CANDIDATE_TAG: ${{ steps.request.outputs.candidate_tag }}
        run: gh release create "$CANDIDATE_TAG" "$RUNNER_TEMP/candidate"/* --repo firestige/crystra-dsh --target "$GITHUB_SHA" --prerelease --verify-tag=false --title "$CANDIDATE_TAG"

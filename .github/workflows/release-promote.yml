name: Release Promote

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Qualified release-set prerelease tag, for example crystra-dsh-v0.1.0-rc.1
        required: true
        type: string

permissions: {}

jobs:
  promote-qualified-set:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download exact candidate release assets
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: gh release download "$CANDIDATE_TAG" --repo firestige/crystra-dsh --dir "$RUNNER_TEMP/candidate"
      - name: Verify qualification and immutable artifact bytes
        run: npm run release:verify -- "$RUNNER_TEMP/candidate"
      - id: release-app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CRYSTRA_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.CRYSTRA_RELEASE_APP_PRIVATE_KEY }}
          owner: firestige
          repositories: crystra-dsh
      - name: Create final GitHub release from the qualified bytes
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        shell: bash
        run: |
          VERSION="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1])).packageVersion' "$RUNNER_TEMP/candidate/release-metadata.json")"
          COMMIT="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1])).commit' "$RUNNER_TEMP/candidate/release-metadata.json")"
          gh release create "crystra-dsh-v$VERSION" "$RUNNER_TEMP/candidate"/* --repo firestige/crystra-dsh --target "$COMMIT" --verify-tag=false --title "$VERSION" --notes "Promoted from qualified candidate $CANDIDATE_TAG."
